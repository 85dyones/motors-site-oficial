# Toda a verificação do código roda aqui, e não na máquina de quem desenvolve.
#
# Por quê: em 13/09 a suíte caiu duas vezes por falta de memória numa máquina
# de 7,9 GB com várias sessões abertas, e travou todos os portões de "suíte
# cheia". Em repositório público o runner padrão do GitHub é grátis e tem
# 4 vCPU e 16 GB. Desde 17/09 o dono pediu "tudo no GitHub Actions": testes,
# tipos, lint, build e o deploy da Vercel aparecem nesta mesma execução, e ela
# só fica verde se todos ficarem.
#
# Sem segredo: chave de produção não entra aqui. O único dado de fora são as
# duas variáveis PÚBLICAS do Supabase (URL e chave anônima, as mesmas que o
# navegador de qualquer visitante recebe), cadastradas no GitHub em
# Settings → Secrets and variables → Actions, e só o job `build` as lê.
# `vitest.config.ts` não carrega `.env`; teste que precisa de variável define
# a própria.
#
# O fuso é o do runner (UTC), o mesmo da Vercel: teste que só passa no fuso
# de Curitiba falha aqui antes de errar em produção.
#
# Os jobs ficam neste arquivo, e não em workflows separados, porque a
# conclusão da EXECUÇÃO é o que o fluxo de merge em lote confere por commit.
name: testes

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Push e pull_request testam árvores diferentes: o push testa o commit do
# branch, e o pull_request testa `refs/pull/N/merge`, o branch somado à base.
# Por isso ficam em grupos separados, e cada grupo só cancela a execução
# anterior do mesmo evento no mesmo ref.
concurrency:
  group: testes-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Nenhum passo precisa do token depois do checkout.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run --reporter=default --reporter=github-actions

  # `tsc` estava fora por 2 erros em `tests/f0-nucleo.test.ts`, corrigidos pelo
  # PR #62 (15/09). Medido em 17/09 sobre o main `9b3baa0`: 0 erros, 13 s.
  tipos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  # Catraca, não faxina. Em 17/09 o main tinha 345 erros de lint em 105
  # arquivos (216 deles `no-explicit-any`). Travar o CI neles deixaria todo PR
  # vermelho; ignorá-los deixaria o número crescer. `eslint-suppressions.json`
  # (gerado no runner com `eslint . --suppress-all`) guarda a contagem de hoje
  # por arquivo e por regra: o lint falha só com erro NOVO.
  #
  # `--pass-on-unpruned-suppressions`: corrigir um erro antigo não pode
  # derrubar o CI de quem corrigiu. A contagem velha fica no arquivo até alguém
  # rodar `npx eslint . --prune-suppressions` e versionar o resultado.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx eslint . --pass-on-unpruned-suppressions

  # A build de verdade, aqui. Sem as variáveis do Supabase ela falha de
  # propósito ("Estoque indisponível: cliente do Supabase não configurado —
  # falta env no deploy", medido em 17/09): as páginas das fichas são geradas
  # com o estoque lido na hora da build. Por isso o job lê as duas variáveis
  # públicas cadastradas no GitHub, e só elas.
  #
  # No pull_request, a build é do `refs/pull/N/merge` (o branch somado à base),
  # coisa que a Vercel não builda.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # `vars` se foram cadastradas como variável; `secrets` se foram como
      # segredo. Os dois valores são públicos por natureza (vão para o bundle).
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: as duas variáveis do Supabase estão cadastradas
        shell: bash
        run: |
          faltam=""
          [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] || faltam="$faltam NEXT_PUBLIC_SUPABASE_URL"
          [ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ] || faltam="$faltam NEXT_PUBLIC_SUPABASE_ANON_KEY"
          if [ -n "$faltam" ]; then
            echo "::error title=build::Faltam no GitHub (Settings → Secrets and variables → Actions):$faltam"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: next build
        shell: bash
        run: |
          set -o pipefail
          npx next build 2>&1 | tee build.log
      # Quem não tem acesso ao log (agente pela API pública) lê o fim da build
      # nas anotações do job.
      - name: fim do log da build, como anotação
        if: failure()
        shell: bash
        run: |
          [ -f build.log ] || exit 0
          tail -n 10 build.log | while IFS= read -r linha; do
            echo "::error title=build (fim do log)::$linha"
          done

  # O deploy da Vercel deste commit: a build acima prova que o código builda; o
  # status "Vercel" prova que a versão publicada (preview ou produção) subiu.
  #
  # No pull_request, o commit conferido é o head do PR: a Vercel não builda o
  # `refs/pull/N/merge`.
  deploy-vercel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      statuses: read
    steps:
      - name: esperar o deploy da Vercel deste commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          inicio=$(date +%s)
          while :; do
            estado=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/commits/$SHA/statuses?per_page=100" \
              | jq -r 'map(select(.context == "Vercel")) | (.[0].state // "ausente")')
            decorrido=$(( $(date +%s) - inicio ))
            case "$estado" in
              success)
                echo "Deploy da Vercel pronto para ${SHA:0:7} (${decorrido}s de espera)."
                exit 0 ;;
              failure|error)
                echo "::error title=deploy-vercel::O deploy da Vercel falhou para ${SHA:0:7}. Veja o status \"Vercel\" do commit."
                exit 1 ;;
              ausente)
                if [ "$decorrido" -gt 600 ]; then
                  echo "::error title=deploy-vercel::A Vercel não publicou status para ${SHA:0:7} em 10 minutos."
                  exit 1
                fi ;;
            esac
            if [ "$decorrido" -gt 1500 ]; then
              echo "::error title=deploy-vercel::O deploy da Vercel não terminou em 25 minutos (último estado: ${estado:-sem resposta})."
              exit 1
            fi
            sleep 20
          done
